<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Apoiadores - Twitch</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:transparent;color:#fff;display:flex;justify-content:center;padding:14px}
.wrapper{width:420px}
.header{text-align:center;margin-bottom:18px}
.header h1{font-size:28px;font-weight:800;line-height:0.95;text-shadow:0 2px 10px rgba(0,0,0,0.8)}
.line{height:4px;background:linear-gradient(90deg,#9d4edd,#ff006e,#00f5ff,#39ff14,#ff7b00);margin-top:10px;border-radius:10px}
.card{background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.12);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px;backdrop-filter:blur(10px);position:relative;overflow:hidden;transition:all 0.25s cubic-bezier(0.34,1.56,0.64,1);cursor:pointer}
.card::after{content:'';position:absolute;top:0;left:-150%;width:70%;height:100%;background:linear-gradient(105deg, transparent 0%, rgba(255,255,255,0.08) 30%, rgba(255,255,255,0.35) 50%, rgba(255,255,255,0.08) 70%, transparent 100%);transform:skewX(-18deg);pointer-events:none;opacity:0}
.card:hover::after{opacity:1;animation:espelhado 0.85s ease-out forwards}
@keyframes espelhado{0%{left:-150%}100%{left:150%}}
.card.comum:hover{border-color:#888;background:linear-gradient(135deg, rgba(136,136,136,0.18), rgba(255,255,255,0.08));box-shadow:0 0 0 2px rgba(136,136,136,0.5), 0 0 20px rgba(136,136,136,0.3)}
.card.comum:hover .rank{background:#555;color:#fff}
.card.incomum{border-color:rgba(111,154,61,0.3)}
.card.incomum:hover{border-color:#6f9a3d;background:linear-gradient(135deg, rgba(111,154,61,0.2), rgba(168,255,136,0.08));box-shadow:0 0 0 2px #6f9a3d, 0 0 25px rgba(111,154,61,0.5)}
.card.incomum:hover .rank{background:#6f9a3d;color:#fff}
.card.incomum:hover .avatar{border-color:#6f9a3d}
.card.raro{border-color:rgba(74,144,226,0.3)}
.card.raro:hover{border-color:#4a90e2;background:linear-gradient(135deg, rgba(74,144,226,0.2), rgba(143,195,255,0.08));box-shadow:0 0 0 2px #4a90e2, 0 0 25px rgba(74,144,226,0.6)}
.card.raro:hover .rank{background:#4a90e2;color:#fff}
.card.raro:hover .avatar{border-color:#4a90e2}
.card.epico{border-color:rgba(168,85,247,0.4)}
.card.epico:hover{border-color:#a855f7;background:linear-gradient(135deg, rgba(168,85,247,0.22), rgba(233,213,255,0.1));box-shadow:0 0 0 2px #a855f7, 0 0 30px rgba(168,85,247,0.6)}
.card.epico:hover .rank{background:#a855f7;color:#fff}
.card.epico:hover .avatar{border-color:#a855f7}
.card.lendario{border-color:rgba(255,215,0,0.35);background:rgba(255,215,0,0.05)}
.card.lendario:hover{border-color:#ffd700;background:linear-gradient(135deg, rgba(255,215,0,0.22), rgba(255,183,0,0.1));box-shadow:0 0 0 2px #ffd700, 0 0 35px rgba(255,215,0,0.7)}
.card.lendario:hover .rank{background:#ffd700;color:#000}
.card.lendario:hover .avatar{border-color:#ffd700}
.card.mitico{border-color:rgba(0,245,255,0.4);background:rgba(0,245,255,0.06)}
.card.mitico:hover{border-color:#00f5ff;background:linear-gradient(135deg, rgba(0,245,255,0.2), rgba(122,92,255,0.15));box-shadow:0 0 0 2px #00f5ff, 0 0 40px rgba(0,245,255,0.7)}
.card.mitico:hover .rank{background:#00f5ff;color:#000}
.card.mitico:hover .avatar{border-color:#00f5ff}
.card:hover{transform:scale(1.03) translateX(4px)}
.bichinho-fundo{position:absolute;right:14%;top:50%;transform:translateY(-50%);font-size:68px;opacity:0.04;pointer-events:none;z-index:0;filter:blur(0.5px);transition:all 0.4s ease}
.card:hover .bichinho-fundo{opacity:0.09;transform:translateY(-50%) scale(1.18)}
.rank{width:36px;height:36px;border-radius:50%;background:#1e1e24;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;z-index:2;transition:all 0.25s ease}
.avatar{width:42px;height:42px;border-radius:50%;overflow:hidden;background:#222;flex-shrink:0;border:2px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;z-index:2;transition:all 0.25s ease}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.info{flex:1;min-width:0;z-index:2}
.name{font-weight:800;font-size:14px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{margin-top:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.time{font-size:11px;color:#fff;background:rgba(0,0,0,0.5);padding:3px 8px;border-radius:6px;font-weight:700;z-index:2}
.badge-rarity{display:inline-flex;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:800;text-transform:uppercase;z-index:2}
.badge-comum{background:#3a3a3a;color:#aaa;border:1px solid #555}
.badge-incomum{background:#2d4a22;color:#a8ff88;border:1px solid #6f9a3d}
.badge-raro{background:#1a2f5a;color:#8fc3ff;border:1px solid #4a90e2}
.badge-epico{background:linear-gradient(90deg,#4a1a6b,#7a2fbf);color:#e9d5ff;border:1px solid #a855f7}
.badge-lendario{background:linear-gradient(90deg,#ff8c00,#ffb700);color:#000;border:1px solid #ffd700}
.badge-mitico{background:linear-gradient(90deg,#00f5ff,#7a5cff);color:#fff;border:1px solid #00f5ff}
.coins{margin-left:auto;text-align:right;z-index:2}
.coins b{color:#ffdb4d;font-size:14px;display:block}
.coins span{font-size:9px;color:#888}
#status{font-size:11px;color:#aaa;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="wrapper">
<div class="header"><h1>APOIADORES DE<br>PATINHAS</h1><div class="line"></div></div>
<div id="lista"></div>
<div id="status">Carregando patinhas reais...</div>
</div>
<script>
// === CONFIG SEGURA PARA PAINEL DA TWITCH - SEM JWT ===
const TWITCH_USERNAME = "miapatinhas"; // seu nome da Twitch

function getRaridade(meses){
  if(meses>=18) return {id:"mitico", label:"👽 MÍTICO", bicho:"👽"};
  if(meses>=12) return {id:"lendario", label:"🐲 LENDÁRIO", bicho:"🐲"};
  if(meses>=6)  return {id:"epico", label:"🧙‍♂️ MAGO", bicho:"🧙‍♂️"};
  if(meses>=3)  return {id:"raro", label:"🦝 RARO", bicho:"🦝"};
  if(meses>=1)  return {id:"incomum", label:"🐸 INCOMUM", bicho:"🐸"};
  return {id:"comum", label:"🥔 COMUM", bicho:"🥔"};
}
function formatarTempo(meses){ if(meses===0) return "Não é sub"; if(meses===1) return "1 mês de sub"; return `${meses} meses de sub`; }
// VOCÊ PODE EDITAR ESSE TEMPO DE SUB MANUALMENTE SE QUISER
const tempoSubManual = { "jarva571": 18, "ninjaeon": 14, "xeno_may": 9, "kairox": 7, "mutano_mg": 5, "tryie1": 3 };

function getAvatarUrl(username){ return `https://unavatar.io/twitch/${username.toLowerCase()}`; }

function render(lista){
  const el = document.getElementById('lista'); el.innerHTML = "";
  lista.forEach((item,i)=>{
    const rar = getRaridade(item.meses);
    const avatarUrl = getAvatarUrl(item.username);
    const iniciais = item.username.substring(0,2).toUpperCase();
    const div = document.createElement('div'); div.className = 'card ' + rar.id;
    div.innerHTML = `<div class="bichinho-fundo ${rar.id}">${rar.bicho}</div><div class="rank">${i+1}</div><div class="avatar"><img src="${avatarUrl}" onerror="this.style.display='none'; this.parentElement.innerHTML='${iniciais}'"></div><div class="info"><div class="name">${item.username}</div><div class="meta"><span class="badge-rarity badge-${rar.id}">${rar.label}</span><span class="time">${formatarTempo(item.meses)}</span></div></div><div class="coins"><b>${item.patinhas.toLocaleString('pt-BR')} 🪙</b><span>PATINHAS</span></div>`;
    el.appendChild(div);
  });
  document.getElementById('status').innerText = `Atualizado agora • ${lista.length} apoiadores • Seguro sem JWT`;
}

async function buscarReal(){
  try{
    // 1. Pega Channel ID publico
    const chanRes = await fetch(`https://api.streamelements.com/kappa/v2/channels/${TWITCH_USERNAME}`);
    if(!chanRes.ok) throw new Error("canal nao encontrado");
    const chanData = await chanRes.json();
    const channelId = chanData._id;
    
    // 2. Pega TOP PATINHAS publico - NAO PRECISA DE JWT PARA VER
    const res = await fetch(`https://api.streamelements.com/kappa/v2/points/${channelId}/top?limit=20`);
    if(!res.ok) throw new Error("top privado");
    const data = await res.json();
    const users = data.users || data;
    
    const lista = users.slice(0,6).map(u=>{
      const meses = tempoSubManual[u.username.toLowerCase()] || 0;
      return { username: u.username, patinhas: u.points || 0, meses: meses }
    }).sort((a,b)=> b.meses - a.meses || b.patinhas - a.patinhas);
    
    render(lista);
  }catch(e){
    console.log("Usando exemplo", e);
    const exemplo = [ { username: "JARVA571", patinhas: 80, meses: 18 }, { username: "NINJAEON", patinhas: 3240, meses: 14 }, { username: "XENO_MAY", patinhas: 1980, meses: 9 }, { username: "KAIROX", patinhas: 860, meses: 7 }, { username: "Mutano_mg", patinhas: 520, meses: 5 }, { username: "Tryie1", patinhas: 120, meses: 3 }, ].sort((a,b)=> b.meses - a.meses);
    render(exemplo);
    document.getElementById('status').innerText = "Mostrando exemplo • Ative o Loyalty publico na StreamElements se nao carregar";
  }
}
buscarReal();
setInterval(buscarReal, 60000);
</script>
</body>
</html>
