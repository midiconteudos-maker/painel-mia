<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Apoiadores - miapatinhas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:transparent;color:#fff;display:flex;justify-content:center;padding:14px}
.wrapper{width:430px}
.header{text-align:center;margin-bottom:18px}
.header h1{font-size:28px;font-weight:800;line-height:0.95;text-shadow:0 2px 10px rgba(0,0,0,0.8)}
.line{height:4px;background:linear-gradient(90deg,#9d4edd,#ff006e,#00f5ff,#39ff14,#ff7b00);margin-top:10px;border-radius:10px}
.card{background:rgba(255,255,255,0.07);border:2px solid rgba(255,255,255,0.12);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px;backdrop-filter:blur(10px)}
.rank{width:36px;height:36px;border-radius:50%;background:#1e1e24;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.avatar{width:46px;height:46px;border-radius:50%;overflow:hidden;background:#222;flex-shrink:0;border:2px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:12px}
.avatar img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}
.name{font-weight:800;font-size:14px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.time{font-size:11px;color:#fff;background:rgba(0,0,0,0.55);padding:4px 8px;border-radius:6px;font-weight:700}
.badge-rarity{display:inline-flex;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:800;text-transform:uppercase}
.badge-incomum{background:#2d4a22;color:#a8ff88;border:1px solid #6f9a3d}
.badge-raro{background:#1a2f5a;color:#8fc3ff;border:1px solid #4a90e2}
.badge-epico{background:linear-gradient(90deg,#4a1a6b,#7a2fbf);color:#e9d5ff;border:1px solid #a855f7}
.badge-lendario{background:linear-gradient(90deg,#ff8c00,#ffb700);color:#000;border:1px solid #ffd700}
.badge-mitico{background:linear-gradient(90deg,#00f5ff,#7a5cff);color:#fff;border:1px solid #00f5ff}
.coins{margin-left:auto;text-align:right;min-width:90px}
.coins b{color:#ffdb4d;font-size:14px;display:block}
.coins span{font-size:9px;color:#888}
#status{font-size:11px;color:rgba(255,255,255,0.35);text-align:center;margin-top:14px}
.empty{text-align:center;color:#777;font-size:13px;margin-top:30px;background:rgba(255,255,255,0.05);padding:20px;border-radius:12px}
</style>
</head>
<body>
<div class="wrapper">
<div class="header"><h1>APOIADORES DE<br>PATINHAS</h1><div class="line"></div></div>
<div id="lista"></div>
<div id="status"></div>
</div>
<script>
// ATUALIZADO AUTOMATICAMENTE PELO ROBÔ - NÃO PRECISA EDITAR NA MÃO
const APOIADORES = [

];

const TWITCH = "miapatinhas";
function getRaridade(m){ if(m>=18)return{id:"mitico",label:"👽 MÍTICO"}; if(m>=12)return{id:"lendario",label:"🐲 LENDÁRIO"}; if(m>=6)return{id:"epico",label:"🧙‍♂️ MAGO"}; if(m>=3)return{id:"raro",label:"🦝 RARO"}; if(m>=1)return{id:"incomum",label:"🐸 INCOMUM"}; return{id:"comum",label:"🥔 COMUM"}; }
function tempo(m){ if(m===1) return "1 mês de sub"; return `${m} meses de sub`; }
function avatarUrl(u){ return `https://unavatar.io/twitch/${u.toLowerCase()}`; }
async function render(){
  const el=document.getElementById('lista'); el.innerHTML="";
  // SÓ SUBS ATIVOS (meses > 0) - SEM TEXTO DE INSTRUÇÃO
  const ativos = APOIADORES.filter(p=>p.meses>0);
  if(ativos.length===0){
    el.innerHTML=`<div class="empty">Nenhum sub ativo</div>`;
    return;
  }
  let pontosMap={};
  try{
    const ch=await (await fetch(`https://api.streamelements.com/kappa/v2/channels/${TWITCH}`)).json();
    const top=await (await fetch(`https://api.streamelements.com/kappa/v2/points/${ch._id}/top?limit=200`)).json();
    const users=top.users||top;
    users.forEach(u=>{ if(u.username) pontosMap[u.username.toLowerCase()]=u.points||0; });
  }catch(e){}
  ativos.sort((a,b)=> b.meses-b.meses);
  ativos.forEach((it,i)=>{
    const rar=getRaridade(it.meses);
    const ini=it.username.slice(0,2).toUpperCase();
    const patinhas=pontosMap[it.username.toLowerCase()] ?? it.patinhas ?? 0;
    const d=document.createElement('div'); d.className='card';
    d.innerHTML=`<div class="rank">${i+1}</div><div class="avatar"><img src="${avatarUrl(it.username)}" onerror="this.style.display='none';this.parentElement.textContent='${ini}'"></div><div class="info"><div class="name">${it.username}</div><div class="meta"><span class="badge-rarity badge-${rar.id}">${rar.label}</span><span class="time">⭐ ${tempo(it.meses)}</span></div></div><div class="coins"><b>${patinhas.toLocaleString('pt-BR')} 🪙</b><span>PATINHAS</span></div>`;
    el.appendChild(d);
  });
  document.getElementById('status').innerText=`${ativos.length} sub(s) ativo(s)`;
}
render();
</script>
</body>
</html>
