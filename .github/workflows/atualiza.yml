name: Painel Oficial - Automatico Subs e Patinhas
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install node-fetch@2
      - name: Busca subs ativos + patinhas (meses + coins)
        run: |
          cat > update.js << 'JS'
          const fetch = require('node-fetch');
          const fs = require('fs');
          const CHANNEL = 'miapatinhas';
          const JWT = process.env.SE_JWT;
          (async()=>{
            console.log('Buscando canal', CHANNEL);
            const cRes = await fetch(`https://api.streamelements.com/kappa/v2/channels/${CHANNEL}`);
            const cJson = await cRes.json();
            const id = cJson._id;
            console.log('Channel ID', id);

            // 1. Subs ativos com meses
            const sRes = await fetch(`https://api.streamelements.com/kappa/v2/subscribers/${id}?limit=100`, {headers:{Authorization:`Bearer ${JWT}`}});
            const sJson = await sRes.json();
            const subs = sJson.docs || sJson || [];
            console.log(`Subs ativos encontrados: ${subs.length}`, subs.map(s=>s.user?.username||s.username));

            // 2. Patinhas (coins)
            let coins = {};
            try{
              const pRes = await fetch(`https://api.streamelements.com/kappa/v2/points/${id}/top?limit=500`, {headers:{Authorization:`Bearer ${JWT}`}});
              const pJson = await pRes.json();
              (pJson.users||[]).forEach(u=>{ coins[u.username.toLowerCase()] = u.points; });
              console.log(`Coins encontrados: ${Object.keys(coins).length}`);
            }catch(e){ console.log('Erro coins', e.message); }

            // 3. Monta final
            const final = subs.map(s=>{
              const username = s.user?.username || s.username;
              const meses = s.totalMonths || s.total || s.amount || 1;
              return {
                username: username,
                totalMeses: parseInt(meses)||1,
                meses: parseInt(meses)||1,
                patinhas: coins[username?.toLowerCase()]||0,
                lastSub: s.lastSub || new Date().toISOString()
              };
            }).filter(x=>x.username);

            // fallback se API subscribers vazia (mantem ultimos conhecidos)
            let toSave = final;
            if(final.length===0){
              console.log('NENHUM SUB NA API, mantendo fallback das 3 ativas');
              toSave = [
                {username:"N_OT_", totalMeses:9, meses:9, patinhas: coins["n_ot_"]||0},
                {username:"JARVA571", totalMeses:7, meses:7, patinhas: coins["jarva571"]||0},
                {username:"RUIVAFPS", totalMeses:3, meses:3, patinhas: coins["ruivafps"]||0},
              ];
            }

            // Salva data/subs.json no formato que o painel oficial lê
            const data = { users: {} };
            toSave.forEach(u=>{
              data.users[u.username.toLowerCase()] = {
                username: u.username,
                totalMeses: u.totalMeses,
                meses: u.totalMeses,
                patinhas: u.patinhas,
                lastSub: u.lastSub||new Date().toISOString()
              };
            });
            fs.mkdirSync('data',{recursive:true});
            fs.writeFileSync('data/subs.json', JSON.stringify(data, null, 2));
            console.log('Salvo data/subs.json', JSON.stringify(data,null,2).slice(0,500));
          })();
          JS
          node update.js
        env:
          SE_JWT: ${{ secrets.SE_JWT }}
      - run: |
          git config user.name "bot-patinha-auto"
          git config user.email "bot@miapatinhas.com"
          git add data/subs.json
          git diff --staged --quiet || (git commit -m "auto: atualiza subs (meses) + patinhas (coins) [bot]" && git push)
