name: Atualiza Subs Automatico

on:
  schedule:
    - cron: '0 */6 * * *'  # a cada 6 horas
  workflow_dispatch:        # botão manual
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Clona repo
        uses: actions/checkout@v3

      - name: Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Cria script de atualização
        run: |
          mkdir -p scripts
          cat > scripts/update.js << 'JS'
          const fetch = require('node-fetch');
          const fs = require('fs');
          const CHANNEL = 'miapatinhas';
          const JWT = process.env.SE_JWT;
          if(!JWT){ console.log('Sem SE_JWT'); process.exit(1); }

          async function run(){
            console.log('Buscando canal...');
            const chanRes = await fetch(`https://api.streamelements.com/kappa/v2/channels/${CHANNEL}`);
            const chan = await chanRes.json();
            const channelId = chan._id;
            console.log('ChannelID', channelId);

            // TOP pontos
            console.log('Buscando top pontos...');
            const topRes = await fetch(`https://api.streamelements.com/kappa/v2/points/${channelId}/top?limit=100`, {
              headers: { Authorization: `Bearer ${JWT}` }
            });
            const topData = await topRes.json();
            const topUsers = topData.users || topData || [];
            const pontosMap = {};
            topUsers.forEach(u => pontosMap[u.username.toLowerCase()] = u.points);

            // Atividades de sub (pega últimos 500 subs)
            console.log('Buscando atividades...');
            let allActs = [];
            for(let offset=0; offset<1000; offset+=100){
              const actRes = await fetch(`https://api.streamelements.com/kappa/v2/activities/${channelId}?limit=100&offset=${offset}`, {
                headers: { Authorization: `Bearer ${JWT}` }
              });
              if(!actRes.ok) break;
              const acts = await actRes.json();
              if(!acts || acts.length===0) break;
              allActs = allActs.concat(acts);
              if(acts.length < 100) break;
            }
            console.log(`Total acts: ${allActs.length}`);

            const subsCount = {};
            allActs.forEach(act => {
              const isSub = act.type && (act.type.includes('sub') || act.type.includes('gift'));
              const dataType = act.data && act.data.type ? act.data.type : '';
              if(isSub || (dataType && dataType.includes('sub'))){
                let username = act.data?.username || act.data?.sender || act.data?.gifter || act.username;
                if(act.data?.gifter) username = act.data.gifter;
                if(!username) return;
                username = username.toLowerCase();
                let amount = 1;
                if(act.data?.amount) amount = parseInt(act.data.amount) || 1;
                if(act.data?.gifted) amount = parseInt(act.data.gifted) || 1;
                subsCount[username] = (subsCount[username]||0) + amount;
              }
            });
            console.log('Subs count', subsCount);

            // Junta tudo
            const todos = new Set([...Object.keys(pontosMap), ...Object.keys(subsCount)]);
            let lista = Array.from(todos).map(k => {
              const orig = topUsers.find(u=>u.username.toLowerCase()===k);
              return {
                username: orig ? orig.username : k,
                meses: subsCount[k] || 0,
                patinhas: pontosMap[k] || 0
              };
            }).filter(u => u.meses>0 || u.patinhas>50).sort((a,b)=> b.meses-b.meses || b.patinhas-a.patinhas).slice(0,30);

            console.log('Lista final', lista);

            // Atualiza index.html
            let html = fs.readFileSync('index.html','utf8');
            const arrayStr = lista.map(u=>`  { username: "${u.username}", meses: ${u.meses}, patinhas: ${u.patinhas} }`).join(',\n');
            // tenta substituir APOIADORES (novo) ou APOIADORES_MANUAL (antigo)
            if(html.includes('const APOIADORES =')){
              html = html.replace(/const APOIADORES = \[([\s\S]*?)\];/, `const APOIADORES = [\n${arrayStr}\n];`);
            } else if(html.includes('APOIADORES_MANUAL')){
              html = html.replace(/const APOIADORES_MANUAL = \[([\s\S]*?)\];/, `const APOIADORES_MANUAL = [\n${arrayStr}\n];`);
              html = html.replace(/const APOIADORES = \[([\s\S]*?)\];/, `const APOIADORES = [\n${arrayStr}\n];`);
            } else {
              // se não achar, injeta antes de buscar()
              html = html.replace('// AQUI VOCE EDITA', `const APOIADORES_AUTO = [\n${arrayStr}\n];\n// AQUI VOCE EDITA`);
            }
            fs.writeFileSync('index.html', html);
            console.log('index.html atualizado');
          }
          run().catch(e=>{ console.error(e); process.exit(1); });
          JS

      - name: Instala fetch
        run: npm install node-fetch@2

      - name: Roda atualização
        run: node scripts/update.js
        env:
          SE_JWT: ${{ secrets.SE_JWT }}

      - name: Commita se mudou
        run: |
          git config user.name "bot-patinha"
          git config user.email "bot@miapatinhas.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "atualiza subs automatico [bot]" && git push)
