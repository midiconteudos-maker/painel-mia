name: Painel Automatico - Subs Ativos
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install node-fetch@2
      - name: Busca subs ativos de verdade
        run: |
          cat > update.js << 'JS'
          const fetch = require('node-fetch');
          const fs = require('fs');
          const CHANNEL = 'miapatinhas';
          const JWT = process.env.SE_JWT;
          async function run(){
            console.log('Buscando canal...');
            const cRes = await fetch(`https://api.streamelements.com/kappa/v2/channels/${CHANNEL}`);
            const chan = await cRes.json();
            console.log('Canal:', chan._id, chan.username);
            const id = chan._id;

            // TENTA 1: subscribers (onde estão os ativos)
            console.log('Tentando /subscribers...');
            let subs = [];
            try{
              const sRes = await fetch(`https://api.streamelements.com/kappa/v2/subscribers/${id}?limit=100`, {
                headers:{ Authorization: `Bearer ${JWT}` }
              });
              const sData = await sRes.json();
              console.log('Resposta subscribers:', JSON.stringify(sData).slice(0,500));
              subs = sData.docs || sData.subscribers || sData || [];
              if(Array.isArray(sData)) subs = sData;
            }catch(e){ console.log('Erro subscribers', e.message); }

            // TENTA 2: activities como backup
            if(subs.length===0){
              console.log('Subscribers vazio, tentando activities...');
              let acts=[];
              for(let off=0; off<500; off+=100){
                const r = await fetch(`https://api.streamelements.com/kappa/v2/activities/${id}?limit=100&offset=${off}&type=sub`, {
                  headers:{ Authorization: `Bearer ${JWT}` }
                });
                const j = await r.json().catch(()=>[]);
                if(!j || j.length===0) break;
                acts = acts.concat(j);
                if(j.length<100) break;
              }
              console.log(`Activities achadas: ${acts.length}`);
              const map={};
              acts.forEach(a=>{
                const u = a.data?.username || a.data?.recipient;
                if(!u) return;
                if(!map[u]) map[u]={username:u, meses:0, last:a.createdAt};
                map[u].meses = Math.max(map[u].meses, parseInt(a.data?.amount)||1);
              });
              subs = Object.values(map);
            }

            console.log(`TOTAL SUBS ATIVOS ENCONTRADOS: ${subs.length}`, subs.map(s=>s.username || s.user?.username).slice(0,10));

            if(subs.length===0){
              console.log('NENHUM SUB ACHADO - vou manter o painel antigo pra não apagar');
              return;
            }

            // pontos
            let pontosMap={};
            try{
              const pRes = await fetch(`https://api.streamelements.com/kappa/v2/points/${id}/top?limit=200`, { headers:{ Authorization: `Bearer ${JWT}` }});
              const pData = await pRes.json().catch(()=>({}));
              (pData.users||[]).forEach(u=>{ if(u.username) pontosMap[u.username.toLowerCase()]=u.points; });
            }catch(e){}

            const final = subs.map(s=>{
              const username = s.username || s.user?.username || s.displayName;
              const meses = s.amount || s.totalMonths || s.tier || 1;
              const patinhas = pontosMap[username?.toLowerCase()]||0;
              return { username, meses: parseInt(meses)||1, patinhas };
            }).filter(x=>x.username).slice(0,30);

            console.log('FINAL:', final);

            let html = fs.readFileSync('index.html','utf8');
            const arrStr = final.map(u=>` { username: "${u.username}", meses: ${u.meses}, patinhas: ${u.patinhas} }`).join(',\n');
            html = html.replace(/const APOIADORES = \[([\s\S]*?)\];/, `const APOIADORES = [\n${arrStr}\n];`);
            fs.writeFileSync('index.html', html);

            fs.mkdirSync('data',{recursive:true});
            fs.writeFileSync('data/debug.json', JSON.stringify({total:subs.length, sample:final.slice(0,5)}, null, 2));
          }
          run().catch(e=>{ console.error(e); process.exit(1); });
          JS
          node update.js
        env:
          SE_JWT: ${{ secrets.SE_JWT }}
      - run: |
          git config user.name "bot-patinha-auto"
          git config user.email "bot@miapatinhas.com"
          git add index.html data
          git diff --staged --quiet || (git commit -m "auto: busca subs em subscribers [bot]" && git push)
