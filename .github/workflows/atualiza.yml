name: Painel Oficial - Automatico Subs e Patinhas
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install node-fetch@2
      - name: Busca TODOS subs ativos + coins
        run: |
          cat > update.js << 'JS'
          const fetch = require('node-fetch');
          const fs = require('fs');
          const CHANNEL = 'miapatinhas';
          const JWT = process.env.SE_JWT;
          (async()=>{
            const cRes = await fetch(`https://api.streamelements.com/kappa/v2/channels/${CHANNEL}`);
            const cJson = await cRes.json();
            const id = cJson._id;
            console.log('Channel ID', id);

            // 1. Busca TODOS subs com paginação
            let allSubs = [];
            let after = null;
            let page = 0;
            do{
              page++;
              let url = `https://api.streamelements.com/kappa/v2/subscribers/${id}?limit=100`;
              if(after) url += `&after=${after}`;
              console.log(`Buscando subs pagina ${page}: ${url}`);
              const sRes = await fetch(url, {headers:{Authorization:`Bearer ${JWT}`}});
              if(!sRes.ok){
                console.log('Erro subs', sRes.status, await sRes.text());
                break;
              }
              const sJson = await sRes.json();
              const docs = sJson.docs || [];
              console.log(`Pagina ${page} retornou ${docs.length} subs`);
              allSubs = allSubs.concat(docs);
              after = sJson._after || sJson.after || null;
              if(!after || docs.length < 100) break;
            }while(after);
            console.log(`TOTAL SUBS ATIVOS ACHADOS: ${allSubs.length}`);
            allSubs.forEach(s=> console.log(`- ${s.user?.username||s.username} | meses: ${s.totalMonths||s.amount} | tier: ${s.tier}`));

            // 2. Busca TODOS coins com paginação
            let coins = {};
            let offset = 0;
            let totalCoins = 0;
            do{
              const pRes = await fetch(`https://api.streamelements.com/kappa/v2/points/${id}/top?limit=100&offset=${offset}`, {headers:{Authorization:`Bearer ${JWT}`}});
              if(!pRes.ok) break;
              const pJson = await pRes.json();
              const users = pJson.users || [];
              users.forEach(u=>{ coins[u.username.toLowerCase()] = u.points; });
              totalCoins += users.length;
              console.log(`Coins pagina offset ${offset} -> ${users.length} usuarios (total ${totalCoins})`);
              if(users.length < 100) break;
              offset += 100;
            }while(offset < 1000);

            // 3. Monta final
            const final = allSubs.map(s=>{
              const username = s.user?.username || s.username;
              const meses = s.totalMonths || s.total || s.amount || 1;
              return {
                username: username,
                totalMeses: parseInt(meses)||1,
                meses: parseInt(meses)||1,
                patinhas: coins[username?.toLowerCase()]||0,
                tier: s.tier||1,
                lastSub: s.updatedAt || s.lastSub || new Date().toISOString()
              };
            }).filter(x=>x.username);

            console.log(`FINAL PARA SALVAR: ${final.length} subs`);

            const data = { users: {}, count: final.length, updatedAt: new Date().toISOString() };
            final.forEach(u=>{
              data.users[u.username.toLowerCase()] = u;
            });
            fs.mkdirSync('data',{recursive:true});
            fs.writeFileSync('data/subs.json', JSON.stringify(data, null, 2));
            fs.writeFileSync('data/subs-full.json', JSON.stringify(final, null, 2));
            console.log('Salvo data/subs.json');
          })();
          JS
          node update.js
        env:
          SE_JWT: ${{ secrets.SE_JWT }}
      - run: |
          git config user.name "bot-patinha-auto"
          git config user.email "bot@miapatinhas.com"
          git add data/subs.json data/subs-full.json
          git diff --staged --quiet || (git commit -m "auto: busca TODOS subs (${{ github.run_id }}) [bot]" && git push)
